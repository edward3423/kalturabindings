<!doctype html>
<html>
  <head>
    <title>Kaltura Autoplay Embed Test</title>
  </head>
  <body>
    <h1>Host page with an autoplaying Kaltura V7 iframe embed</h1>
    <!-- Autoplay without a user gesture falls back to muted playback, like an LMS page that starts muted. -->
    <iframe
      id="player"
      width="640"
      height="400"
      allow="autoplay *; fullscreen *"
      src='https://cdnapisec.kaltura.com/p/2215841/embedPlaykitJs/uiconf_id/42237501?iframeembed=true&entry_id=1_ebs5e9cy&config[playback]={"autoplay":true}'
    ></iframe>
  </body>
</html>
